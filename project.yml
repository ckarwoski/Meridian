name: Meridian
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: RA2Y7LX38Z
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0

schemes:
  Meridian:
    shared: true
    build:
      targets:
        Meridian: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MeridianTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Meridian:
    type: application
    platform: macOS
    bundleId: com.moondustries.Meridian
    sources:
      - path: Sources
        type: syncedFolder
      # xcodegen drops a target-level resources: key when the target uses
      # syncedFolder sources, so Resources is listed here with an explicit
      # build phase. It is a plain group: run `xcodegen generate` after
      # adding files. The app icon is the Icon Composer bundle
      # Resources/AppIcon/Meridian.icon; its layer SVGs are generated by
      # scripts/make-icon.swift (see the header there).
      - path: Resources
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Meridian
        INFOPLIST_KEY_CFBundleDisplayName: Meridian
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.moondustries.Meridian
        ENABLE_HARDENED_RUNTIME: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    # City search goes through MapKit's place search, which needs outbound
    # network access from inside the sandbox.
    entitlements:
      path: Sources/Meridian.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    dependencies: []

  MeridianTests:
    type: bundle.unit-test
    platform: macOS
    bundleId: com.moondustries.Meridian.Tests
    sources:
      - path: Tests
        type: syncedFolder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.moondustries.Meridian.Tests
    dependencies:
      - target: Meridian
